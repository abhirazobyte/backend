name: Deploy Laravel Backend to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.CPANEL_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Deploy over OpenSSH
        env:
          SSH_HOST: ${{ secrets.CPANEL_HOST }}
          SSH_USER: ${{ secrets.CPANEL_USERNAME }}
          GH_TOKEN: ${{ secrets.DEPLOY_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          DEPLOY_REPO: ${{ secrets.DEPLOY_REPO || github.repository }}
          DEPLOY_BRANCH: ${{ secrets.DEPLOY_BRANCH || github.ref_name }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=accept-new \
            -o KexAlgorithms=diffie-hellman-group-exchange-sha256 \
            -o HostKeyAlgorithms=+ssh-rsa,rsa-sha2-256,rsa-sha2-512 \
            -o PubkeyAcceptedAlgorithms=+ssh-rsa,rsa-sha2-256,rsa-sha2-512 \
            -p 22 \
            "$SSH_USER@$SSH_HOST" \
            "export GH_TOKEN='$GH_TOKEN' DEPLOY_REPO='$DEPLOY_REPO' DEPLOY_BRANCH='$DEPLOY_BRANCH' DEPLOY_PATH='$DEPLOY_PATH'; bash -s" << 'ENDSSH'
          set -e
          SITE_DIR="${DEPLOY_PATH:-/home1/a1637tnt/crm.razobyte.com}"
          BRANCH="${DEPLOY_BRANCH:-main}"
          REPO="${DEPLOY_REPO}"
          AUTH="AUTHORIZATION: bearer ${GH_TOKEN}"

          cd "$SITE_DIR"
          echo "Deploying github.com/${REPO} branch ${BRANCH} into ${SITE_DIR}"

          git config --global --add safe.directory "$SITE_DIR" || true

          if [ ! -d .git ]; then
            echo "No git repo here. Initializing..."
            git init
          fi

          git remote rm origin >/dev/null 2>&1 || true
          git remote add origin "https://github.com/${REPO}.git"
          git config remote.origin.fetch "+refs/heads/*:refs/remotes/origin/*"

          git -c http.extraheader="$AUTH" fetch origin "+refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}"

          if [ -f .env ]; then
            cp -f .env /tmp/crm.env.bak
          fi

          git update-ref "refs/heads/${BRANCH}" FETCH_HEAD
          git symbolic-ref HEAD "refs/heads/${BRANCH}"
          git reset --hard HEAD

          if [ -f /tmp/crm.env.bak ]; then
            cp -f /tmp/crm.env.bak .env
          fi

          if [ ! -f .env ]; then
            echo "ERROR: .env is missing on the server. Copy it in cPanel before Laravel can boot."
            exit 1
          fi

          sed -i '/text\/x-generic/d' .env
          sed -i 's/\r$//' .env

          mkdir -p storage/framework/cache storage/framework/sessions storage/framework/views storage/logs bootstrap/cache
          chmod -R ug+rwx storage bootstrap/cache || true

          PHP_BIN=""
          for candidate in \
            /opt/cpanel/ea-php81/root/usr/bin/php \
            /opt/cpanel/ea-php80/root/usr/bin/php \
            /opt/cpanel/ea-php82/root/usr/bin/php \
            /usr/local/bin/ea-php81 \
            /usr/local/bin/ea-php80 \
            /usr/local/bin/ea-php82 \
            "$(command -v ea-php81 2>/dev/null || true)" \
            "$(command -v ea-php80 2>/dev/null || true)" \
            "$(command -v ea-php82 2>/dev/null || true)"
          do
            if [ -n "$candidate" ] && [ -x "$candidate" ] && "$candidate" -r 'exit(PHP_VERSION_ID >= 80000 ? 0 : 1);'; then
              PHP_BIN="$candidate"
              break
            fi
          done

          if [ -z "$PHP_BIN" ]; then
            echo "ERROR: Default php is $(php -v 2>/dev/null | head -1)"
            echo "Laravel 8 vendor needs PHP 8.0+. Enable PHP 8.1 or 8.2 in cPanel MultiPHP Manager, then re-run deploy."
            ls -d /opt/cpanel/ea-php* 2>/dev/null || true
            exit 1
          fi

          echo "Using PHP: $PHP_BIN ($($PHP_BIN -r 'echo PHP_VERSION;'))"

          if [ ! -f composer.phar ]; then
            $PHP_BIN -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
            $PHP_BIN composer-setup.php --install-dir=. --filename=composer.phar
            rm -f composer-setup.php
          fi

          COMPOSER_MEMORY_LIMIT=-1 $PHP_BIN composer.phar install --no-dev --optimize-autoloader --no-interaction --no-scripts --ignore-platform-req=php

          if [ ! -f vendor/autoload.php ]; then
            echo "ERROR: vendor/autoload.php is missing after composer install"
            exit 1
          fi

          $PHP_BIN artisan optimize:clear

          echo "Deploy finished"
          ENDSSH
