name: Deploy Laravel Backend to cPanel

on:
  push:
    branches:
      - main
      - newmain
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.CPANEL_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Deploy over OpenSSH
        env:
          SSH_HOST: ${{ secrets.CPANEL_HOST }}
          SSH_USER: ${{ secrets.CPANEL_USERNAME }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=accept-new \
            -o KexAlgorithms=diffie-hellman-group-exchange-sha256 \
            -o HostKeyAlgorithms=+ssh-rsa,rsa-sha2-256,rsa-sha2-512 \
            -o PubkeyAcceptedAlgorithms=+ssh-rsa,rsa-sha2-256,rsa-sha2-512 \
            -p 22 \
            "$SSH_USER@$SSH_HOST" \
            "export GH_TOKEN='$GH_TOKEN'; bash -s" << 'ENDSSH'
          set -e
          cd /home1/a1637tnt/crm.razobyte.com
          AUTH="AUTHORIZATION: bearer ${GH_TOKEN}"

          if [ ! -d .git ]; then
            echo "No git repo here. Initializing..."
            git init
            git remote add origin https://github.com/abhirazobyte/LangmaBackend.git
          fi

          git remote set-url origin https://github.com/abhirazobyte/LangmaBackend.git
          git -c http.extraheader="$AUTH" fetch origin

          if git rev-parse --verify origin/newmain >/dev/null 2>&1; then
            git checkout -B newmain origin/newmain
          else
            git checkout -B main origin/main
          fi

          if command -v composer >/dev/null 2>&1; then
            composer install --no-dev --optimize-autoloader --no-interaction
          fi

          php artisan optimize:clear
          echo "Deploy finished"
          ENDSSH
